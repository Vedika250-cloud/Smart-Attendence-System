{% extends 'base.html' %}{% block heading %}Edit Student{% endblock %}{% block content %}<div class="page-card"><div class="card-head"><div><h2>Update student details</h2><p>Changes are persisted to the shared database.</p></div></div><form method="post" class="form-grid"><div><label>Roll number</label><input name="roll_no" value="{{ student.roll_no }}" required></div><div><label>First name</label><input name="first_name" value="{{ student.first_name }}" required></div><div><label>Last name</label><input name="last_name" value="{{ student.last_name }}" required></div><div><label>Email</label><input name="email" type="email" value="{{ student.email or '' }}"></div><div><label>Phone</label><input name="phone" value="{{ student.phone or '' }}"></div><div><label>Class</label><select name="class_id" required>{% for c in classes %}<option value="{{ c.class_id }}" {% if c.class_id==student.class_id %}selected{% endif %}>{{ c.class_name }} — {{ c.course.course_code }}</option>{% endfor %}</select></div><div class="full"><button class="primary-btn">Save changes</button> <a class="secondary-btn" href="/students">Cancel</a></div></form></div>{% endblock %}
